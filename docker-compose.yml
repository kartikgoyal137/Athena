version: '3.8'
services:
  web:
    labels:
      - "environment=development"
    build: .
    volumes:
      - .:/usr/app/
      - /usr/app/node_modules
    depends_on:
      - mongo
    links:
      - mongo
    ports:
      - 4000:4000
    networks:
      - quizio
  mongo:
    labels:
      - "environment=development"
    image: mongo
    ports:
      - 27017:27017
    networks:
      - quizio
    volumes:
      - './data:/data/db'
networks:
  quizio:
    name: quizio
